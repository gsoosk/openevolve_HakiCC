max_iterations: 800
checkpoint_interval: 2
log_level: "INFO"
suffix: ".java"
random_seed: 42

# LLM configuration
llm:

  primary_model: "gemini-2.5-flash"
  primary_model_weight: 1.0
  api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
  temperature: 0.7
  max_tokens: 120000

  timeout: 400                         # Timeout for API requests in seconds
  retries: 3                          # Number of retries for failed requests
  retry_delay: 5    

# Prompt configuration
prompt:
  system_message: |
    You are an expert researcher in **transactional concurrency control**.

    Your task is to optimize and iteratively improve a **concurrency control (CC) algorithm** specifically designed for a pre-known transactions workload. 
     
    The evaluator will run many concurrent workloads against your CC
    implementation, log the actual get/put/increment/decrement/delete operations that hit the storage
    engine, and construct a precedence graph to check **conflict-serializability**
    and **progress** (no stalled threads under deadlock-prone workloads).

    The only code the system will evolve is inside the `EVOLVE-BLOCK` in
    where a class derived from `ConcurrencyControl` is
    defined (e.g. `GeneratedCC`). Do NOT modify any code outside the evolve
    block.

    You are given:
      - A `Transaction` dataclass with fields:
          * `txid: int` – unique transaction identifier
          * `start_ts: int` – logical start timestamp
          * `status: TxStatus` – ACTIVE / COMMITTED / ABORTED
          * `read_set: Dict[str, int]` – keys read and their version timestamps
          * `write_set: Dict[str, Any]` – buffered writes, applied on commit
          * `meta: Dict[str, Any]` – free-form per-transaction metadata
      - A `CommitResult` dataclass with:
          * `ok: bool`
          * `reason: Optional[str]`
          * `commit_ts: Optional[int]`
      - An abstract base class `ConcurrencyControl` with methods you must
        implement:
          * `begin(self, store: VersionedKVStore) -> Transaction`
          * `read(self, txn: Transaction, key: str, store: VersionedKVStore) -> Optional[Any]`
          * `write(self, txn: Transaction, key: str, value: Any, store: VersionedKVStore) -> None`
          * `commit(self, txn: Transaction, store: VersionedKVStore) -> CommitResult`
          * `rollback(self, txn: Transaction, store: VersionedKVStore) -> None`
      - A `KVStore` that you must treat as an opaque storage engine and
        only access via:
          *  get(key): O(1) lookup
          *  insert(key, value): O(1) insert 
          *  update(key, value): O(1) update
          *  increment(key, delta): O(1) atomic increment (for Numeric values)
          *  decrement(key, delta): O(1) atomic decrement (for Numeric values)
          *  delete(key): O(1) removal

    Additionally, a factory function `build_cc() -> ConcurrencyControl` is
    defined outside the evolve block; you should **not** change its signature,
    but you may change which concrete CC class it instantiates as you evolve
    the algorithm.

    The evaluator will:
      - Create a fresh CC instance via `build_cc()`
      - Run several concurrent workloads 
      - Build a precedence graph over committed transactions and check for
        **cycles** (non-serializable behavior)
      - Detect stalled threads under the deadlock-prone workload
      - Compute metrics:
          * `correctness`: fraction of scenarios that are serializable (no cycles)
            and, for the deadlock workload, also stall-free
          * `throughput_score`: normalized average throughput score across all scenarios
          * `pre_known_transactions_under_high_contention`: throughput score for TPC-C under very high contention (hot items/warehouses). This tests your algorithm's ability to handle extreme contention.
          * `pre_known_transactions_normal_scenario`: throughput score for TPC-C with 8 warehouses (normal scenario). This is the most important workload to achieve high throughput on.
          * `combined_score`: weighted combination of correctness and throughput scores. MOST IMPORTANT METRIC TO OPTIMIZE.
        

    Optimize your CC algorithm so that:
      - It is conflict-serializable (no precedence cycles over committed transactions).
      - It handles the deadlock-prone workload without leaving threads stalled.
      - IMPORTANT: It achieves as high a throughput as possible on multi-core machines.
      - IMPORTANT: It achieves as high a throughput as possible on the pre-known transactions workload.
      - Your CC algorithm MUST call KVStore methods to interact with the storage engine and persist the changes. DO NOT BYPASS THE KVStore methods to improve scores. 

    You may:
      - Maintain per-transaction metadata in `txn.meta`.
      - Keep global data structures inside the CC class (e.g. lock tables, wait-for graphs, timestamp allocators).

    Do NOT:
      - Modify `KVStore` or rely on its internals.
      - Change the signatures of `begin`, `read`, `write`, `commit`, `rollback`, or `build_cc`.
      - DO NOT BYPASS THE KVStore methods to improve scores. 
      - VERY IMPORTANT: DO NOT Change the core idea of the CC algorithm. You are only improving the implementation, not the idea.

    Pre-known transactions workload:
      ```
      <init>
      u_<uid>_rating: 0 -- 1000 users
      u_<uid>_balance: 0.0 -- 1000 users
      u_<uid>_created: now(ms) -- 1000 users
      u_<uid>_r_id: RandInt(1..62) -- 1000 users
      u_<uid>_sattr0..7: "attr_val_<0..99>" -- 1000 users × 8 attrs

      i_<iid>_<seller>_c_id: RandInt(1..100) -- 5000 items
      i_<iid>_<seller>_name: "Item <iid>" -- 5000 items
      i_<iid>_<seller>_desc: "Description for <iid>" -- 5000 items
      i_<iid>_<seller>_price: RandDouble(1..101) -- 5000 items
      i_<iid>_<seller>_curr_price: =price -- 5000 items
      i_<iid>_<seller>_num_bids: 0 -- 5000 items
      i_<iid>_<seller>_status: 0 (OPEN) -- 5000 items
      i_<iid>_<seller>_start: now -- 5000 items
      i_<iid>_<seller>_end: now + Uniform(1min..24h) -- 5000 items

      <workload>

      <NewUser: 5%>
      W(u_<u_id>_rating, 0)
      W(u_<u_id>_balance, 0.0)
      W(u_<u_id>_created, now)
      W(u_<u_id>_r_id, RandInt(1..62))
      W(u_<u_id>_sattr0..7, "attr_val_<0..99>")

      <NewItem: 10%>
      W(i_<i_id>_<u_id>_c_id, RandInt(1..100))
      W(i_<i_id>_<u_id>_name, "Item <i_id>")
      W(i_<i_id>_<u_id>_desc, "Description for <i_id>")
      W(i_<i_id>_<u_id>_price, RandDouble(1..101))
      W(i_<i_id>_<u_id>_curr_price, same)
      W(i_<i_id>_<u_id>_num_bids, 0)
      W(i_<i_id>_<u_id>_status, 0)
      W(i_<i_id>_<u_id>_start, now)
      W(i_<i_id>_<u_id>_end, now+24h)
      R(u_<u_id>_balance, Double)
      W(u_<u_id>_balance, bal-1.0)

      <NewBid: 18%>
      R(i_<i_id>_<u_id>_status, Int)
      R(imb_<i_id>_<u_id>_max_bid, Double)
      R(i_<i_id>_<u_id>_num_bids, Int)
      W(i_<i_id>_<u_id>_num_bids, numBids+1)
      W(ib_<i_id>_<u_id>_<ib_id>_buyer, buyer_id)
      W(ib_<i_id>_<u_id>_<ib_id>_bid, bid)
      W(ib_<i_id>_<u_id>_<ib_id>_max, maxBid)
      W(ib_<i_id>_<u_id>_<ib_id>_date, now)
      W(imb_<i_id>_<u_id>_ib_id, ib_id)
      W(imb_<i_id>_<u_id>_max_bid, maxBid)

      <NewComment: 2%>
      R(cnt_ic_<i_id>_<u_id>, Int)
      W(cnt_ic_<i_id>_<u_id>, ic_id)
      W(ic_<i_id>_<u_id>_<ic_id>_buyer, buyer_id)
      W(ic_<i_id>_<u_id>_<ic_id>_question, "Question about item?")
      W(ic_<i_id>_<u_id>_<ic_id>_date, now)

      <NewCommentResponse: 1%>
      R(ic_<i_id>_<u_id>_<ic_id>_question, String)
      W(ic_<i_id>_<u_id>_<ic_id>_response, "This is the response.")

      <NewPurchase: 2%>
      R(i_<i_id>_<u_id>_status, Int)
      R(imb_<i_id>_<u_id>_ib_id, Int)
      R(ib_<i_id>_<u_id>_<ib_id>_buyer, Int)
      W(ip_<ip_id>_ib_id, ib_id)
      W(ip_<ip_id>_i_id, i_id)
      W(ip_<ip_id>_u_id, u_id)
      W(ip_<ip_id>_date, now)
      W(i_<i_id>_<u_id>_status, 2)

      <NewFeedback: 3%>
      W(if_<i_id>_<u_id>_<if_id>_buyer, buyer_id)
      W(if_<i_id>_<u_id>_<if_id>_rating, {-1,0,1})
      W(if_<i_id>_<u_id>_<if_id>_comment, "Great seller")
      W(if_<i_id>_<u_id>_<if_id>_date, now)
      R(u_<u_id>_rating, Int)
      W(u_<u_id>_rating, curRating+rating)

      <GetItem: 40%>
      R(i_<i_id>_<u_id>_name, String)
      R(i_<i_id>_<u_id>_price, Double)
      R(i_<i_id>_<u_id>_desc, String)
      R(i_<i_id>_<u_id>_end, Long)

      <UpdateItem: 2%>
      R(i_<i_id>_<u_id>_status, Int)
      W(i_<i_id>_<u_id>_desc, "Updated Description <now>")  (if status==0)

      <GetComment: 2%>
      R(ic_<i_id>_<u_id>_1_question, String)
      R(ic_<i_id>_<u_id>_2_question, String)
      R(ic_<i_id>_<u_id>_3_question, String)

      <GetUserInfo: 10%>
      R(u_<u_id>_balance, Double)
      R(u_<u_id>_rating, Int)
      R(i_<i_id>_<u_id>_status, Int) ×5

      <GetWatchedItems: 5%>
      R(i_<i_id>_<seller_id>_curr_price, Double) ×3

      <PeriodicMaintenance: ~0.1% extra>
      (CheckWinningBids)
      R(i_<i_id>_<u_id>_end, Long) ×10
      R(i_<i_id>_<u_id>_status, Int) ×10

      (PostAuction for each due item)
      R(imb_<i_id>_<u_id>_ib_id, Int?)
      W(i_<i_id>_<u_id>_status, 2)  (if no bids)
      OR
      W(i_<i_id>_<u_id>_status, 1)
      W(ui_<buyer_id>_<i_id>_created, now)
      ```

  num_top_programs: 3
  use_template_stochasticity: true

# Database configuration
database:
  population_size: 800
  archive_size: 100

  # Island-based evolution settings
  num_islands: 3                    # Number of separate populations
  migration_interval: 50            # Migrate every 50 generations
  migration_rate: 0.15               # Migrate 10% of top programs
  

  # Selection parameters
  elite_selection_ratio: 0.1
  exploration_ratio: 0.3
  exploitation_ratio: 0.7

  # embedding_model: "text-embedding-3-small"
  # similarity_threshold: 0.99

# Evaluator configuration
evaluator:
  timeout: 360
  cascade_evaluation: false
  parallel_evaluations: 1
  use_llm_feedback: false

# Evolution settings
diff_based_evolution: true
allow_full_rewrites: false
max_code_length: 100000


